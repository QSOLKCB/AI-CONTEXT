name: AI-CONTEXT CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install conformance, storage, signing, and archival dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-dev.txt
          -r requirements-storage.txt
          -r requirements-signing.txt
          -r requirements-archive.txt
      - name: Syntax check
        run: >-
          python -m py_compile
          tools/ai_context.py
          tools/provider_adapters.py
          tools/provider_import.py
          tools/evidence_adapters.py
          tools/evidence_import.py
          tools/validate_evidence.py
          tools/curation.py
          tools/validate_curation.py
          tools/routing.py
          tools/validate_routing.py
          tools/validate_bundle_readonly.py
          tools/storage.py
          tools/restore_legacy.py
          tools/restore.py
          tools/indexes_legacy.py
          tools/indexes.py
          tools/interop.py
          tools/ux_legacy.py
          tools/ux.py
          tools/release_audit.py
          tools/validate_formalization.py
          tools/build_phase13_artifacts.py
          tools/verify_phase13_artifacts.py
          tests/test_ai_context.py
          tests/test_phase2_conformance.py
          tests/test_schema_conformance.py
          tests/test_phase3_provider_adapters.py
          tests/test_phase4_evidence.py
          tests/test_phase5_curation.py
          tests/test_phase6_routing.py
          tests/test_phase7_storage.py
          tests/test_phase8_restore.py
          tests/test_phase8_codex_hardening.py
          tests/test_phase9_indexes.py
          tests/test_phase9_codex_hardening.py
          tests/test_phase10_interop.py
          tests/test_phase10_codex_hardening.py
          tests/test_phase11_ux.py
          tests/test_phase11_codex_hardening.py
          tests/test_release_candidate.py
          tests/test_phase12_formalization.py
          tests/test_phase13_archive.py
          tests/test_phase13_codex_hardening.py
      - name: Unit, security, schema, provider-drift, evidence, curation, routing, storage, restore, index, interoperability, UX, release-candidate, formalization, and archival tests
        run: python -m unittest discover -s tests -v
      - name: Validate language-neutral interoperability fixture in Python
        run: >-
          python tools/interop.py validate-fixtures
          fixtures/interoperability/conformance-v0.1.0.json
      - name: Test Rust interoperability verifier
        run: cargo test --manifest-path rust/ai-context-interop/Cargo.toml
      - name: Validate capability manifest in Rust
        run: >-
          cargo run --quiet --manifest-path rust/ai-context-interop/Cargo.toml --
          capabilities fixtures/interoperability/capability-manifest.python.json
      - name: Validate interoperability fixture in Rust
        run: >-
          cargo run --quiet --manifest-path rust/ai-context-interop/Cargo.toml --
          validate-fixtures fixtures/interoperability/conformance-v0.1.0.json
      - name: Audit tracked public release tree
        run: >-
          python tools/release_audit.py .
          --receipt /tmp/ai-context-release-audit.json
      - name: Validate formalization inventory
        run: python tools/validate_formalization.py
      - name: Install elan
        run: curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
      - name: Build Lean 4 formalization
        run: ~/.elan/bin/lake build
      - name: Build Phase 13 Zenodo artifacts
        run: python tools/build_phase13_artifacts.py --out /tmp/ai-context-phase13
      - name: Verify Phase 13 Zenodo artifacts
        run: python tools/verify_phase13_artifacts.py /tmp/ai-context-phase13
      - name: Reproduce frozen reference and formalization from source ZIP
        run: |
          rm -rf /tmp/ai-context-phase13-repro
          python - <<'PY'
          from pathlib import Path
          from tools.verify_phase13_artifacts import extract_verified_source
          extract_verified_source(
              Path('/tmp/ai-context-phase13/AI-CONTEXT-1.0.0-source.zip'),
              Path('/tmp/ai-context-phase13-repro'),
          )
          PY
          (
            cd /tmp/ai-context-phase13-repro/reference-v1.0.0
            git init -q
            git config user.name "AI-CONTEXT archival reproduction"
            git config user.email "archive-reproduction@example.invalid"
            git add -f -A
            git commit -q -m "Reconstitute archived v1.0.0 tree for Git-dependent tests"
            python -m unittest discover -s tests -v
          )
          (
            cd /tmp/ai-context-phase13-repro/formal
            ~/.elan/bin/lake build
            python tools/validate_formalization.py
          )
      - name: Upload Zenodo-ready three-file archive surface
        uses: actions/upload-artifact@v4
        with:
          name: AI-CONTEXT-v1.0.0-Zenodo
          path: /tmp/ai-context-phase13/*
          if-no-files-found: error
          compression-level: 0
