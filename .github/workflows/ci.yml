name: AI-CONTEXT CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install conformance and storage test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-dev.txt
          -r requirements-storage.txt
      - name: Syntax check
        run: >-
          python -m py_compile
          tools/ai_context.py
          tools/provider_adapters.py
          tools/provider_import.py
          tools/evidence_adapters.py
          tools/evidence_import.py
          tools/validate_evidence.py
          tools/curation.py
          tools/validate_curation.py
          tools/routing.py
          tools/validate_routing.py
          tools/storage.py
          tools/restore.py
          tests/test_ai_context.py
          tests/test_phase2_conformance.py
          tests/test_schema_conformance.py
          tests/test_phase3_provider_adapters.py
          tests/test_phase4_evidence.py
          tests/test_phase5_curation.py
          tests/test_phase6_routing.py
          tests/test_phase7_storage.py
          tests/test_phase8_restore.py
      - name: Unit, security, schema, provider-drift, evidence, curation, routing, storage, and restore tests
        run: python -m unittest discover -s tests -v
