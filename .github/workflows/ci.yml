name: AI-CONTEXT CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install conformance test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Syntax check
        run: >-
          python -m py_compile
          tools/ai_context.py
          tools/provider_adapters.py
          tools/provider_import.py
          tests/test_ai_context.py
          tests/test_phase2_conformance.py
          tests/test_schema_conformance.py
          tests/test_phase3_provider_adapters.py
      - name: Unit, security, schema, and provider-drift tests
        run: python -m unittest discover -s tests -v
