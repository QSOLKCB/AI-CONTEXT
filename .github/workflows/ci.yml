name: AI-CONTEXT CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile tools/ai_context.py tests/test_ai_context.py
      - name: Unit and security tests
        run: python -m unittest discover -s tests -v
